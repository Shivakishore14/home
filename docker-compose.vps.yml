# ==============================================================================
# VPS Docker Compose
# ==============================================================================
# Standalone stack for a public VPS, separate from the Mac mini home-server
# compose files. Keeping this as one file for now; once more services are
# added here, split them out into compose/<service>.yml like the home stack
# and merge them via COMPOSE_FILE in .env.
# ==============================================================================

networks:
  vps-network:
    name: vps-network
    driver: bridge

services:
  taskengine:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskengine:latest
    container_name: taskengine
    restart: unless-stopped
    ports:
      - "${TASKENGINE_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./tasks:/app/tasks
    environment:
      - PORT=8080
      - TZ=${TZ:-UTC}
    networks:
      - vps-network

  ntfy:
    image: binwiederhier/ntfy:${NTFY_VERSION:-latest}
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:${NTFY_PORT:-8090}}
      - NTFY_LISTEN_HTTP=:80
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ENABLE_LOGIN=true
      - NTFY_ENABLE_SIGNUP=false
    ports:
      - "${NTFY_PORT:-8090}:80"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\" *: *true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network
