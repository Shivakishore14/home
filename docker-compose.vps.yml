# ==============================================================================
# VPS Docker Compose
# ==============================================================================
# Standalone stack for a public VPS, separate from the Mac mini home-server
# compose files. Keeping this as one file for now; once more services are
# added here, split them out into compose/<service>.yml like the home stack
# and merge them via COMPOSE_FILE in .env.
# ==============================================================================

networks:
  vps-network:
    name: vps-network
    driver: bridge

services:
  taskengine:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskengine:latest
    container_name: taskengine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./tasks:/app/tasks
    environment:
      - PORT=8080
      - TZ=${TZ:-UTC}
      - TASKENGINE_API_KEY=${TASKENGINE_API_KEY}
    networks:
      - vps-network

  ntfy:
    image: binwiederhier/ntfy:${NTFY_VERSION:-latest}
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_LISTEN_HTTP=:80
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ENABLE_LOGIN=true
      - NTFY_ENABLE_SIGNUP=false
    expose:
      - "80"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\" *: *true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network

  # ============================================================================
  # Observability Stack (Ultra-Low-Spec: VictoriaMetrics + VictoriaLogs + Vector + Grafana)
  # ============================================================================
  # Private scrape targets & dashboards are mounted from PRIVATE_REPO_DIR
  # (defaults to ./private) so no internal service names leak in this repo.
  # ============================================================================

  victoriametrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION:-v1.112.0}
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=${METRICS_RETENTION:-14d}"
      - "--memory.allowedBytes=128MB"
      - "--promscrape.config=/etc/victoriametrics/scrape.yml"
      - "--promscrape.configCheckInterval=30s"
    expose:
      - "8428"
    ports:
      - "127.0.0.1:${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - ./data/victoriametrics:/storage
      - ${PRIVATE_REPO_DIR:-./private}/monitoring/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    deploy:
      resources:
        limits:
          memory: 180M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network

  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION:-v1.15.0-victorialogs}
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "--storageDataPath=/vlogs"
      - "--retentionPeriod=${LOGS_RETENTION:-7d}"
      - "--memory.allowedBytes=128MB"
    expose:
      - "9428"
    ports:
      - "127.0.0.1:${VICTORIALOGS_PORT:-9428}:9428"
    volumes:
      - ./data/victorialogs:/vlogs
    deploy:
      resources:
        limits:
          memory: 180M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network

  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.45.0-alpine}
    container_name: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      - PROCFS_ROOT=/host/proc
      - SYSFS_ROOT=/host/sys
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./data/vector:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      - victoriametrics
      - victorialogs
    deploy:
      resources:
        limits:
          memory: 80M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.5.2}
    container_name: grafana
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - TZ=${TZ:-UTC}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${PRIVATE_REPO_DIR:-./private}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${PRIVATE_REPO_DIR:-./private}/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      - victoriametrics
      - victorialogs
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vps-network

