# ==============================================================================
# Grafana Provisioned Dashboards
# ==============================================================================
# Loads dashboards from /etc/grafana/dashboards (baked in from ./private/grafana/dashboards
# during image build) and automatically organizes folders from directory structure.
# ==============================================================================

apiVersion: 1

providers:
  - name: "Private Code-Driven Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
