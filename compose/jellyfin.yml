# ==============================================================================
# Jellyfin Media Server Service Definition
# ==============================================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      # Persistent Configuration data (on external drive)
      - "${DOCKER_DIR}/jellyfin/config:/config"
      # Cache data (on external drive)
      - "${DOCKER_DIR}/jellyfin/cache:/cache"
      # Read-only mount of the media libraries
      - "${MEDIA_DIR}:/media:ro"
    networks:
      - home-network
    environment:
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=http://localhost:${JELLYFIN_PORT:-8096}
    healthcheck:
      # Verify container health by hitting Jellyfin's internal health check endpoint
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
