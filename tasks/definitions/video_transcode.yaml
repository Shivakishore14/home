name: "video-transcode-media"
plugin_name: "video-transcoder"
schedule: "*/15 * * * *"
enabled: true
priority: 10
scanner:
  directory: "/Volumes/drive001/media"
  target_extensions: [".mkv", ".mp4", ".mov", ".avi", ".ts", ".m2ts", ".wmv", ".flv"]
params:
  directory: "/Volumes/drive001/media"
  target_codec: "libx264"
  target_height: 1080
  crf: 21
  preset: "medium"
  audio_bitrate: "192k"
  container: "mp4"
