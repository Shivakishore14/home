name: "network-ping-check"
plugin_name: "command-runner"
schedule: "*/5 * * * *"
enabled: true
priority: 5
params:
  command: |
    echo "=== Network Ping Health Check ==="
    echo "Target: 1.1.1.1 (Cloudflare DNS)"
    echo "PROGRESS: 25%"
    ping -c 3 1.1.1.1
    echo "PROGRESS: 75%"
    echo "Ping latency check completed successfully."
    echo "PROGRESS: 100%"
