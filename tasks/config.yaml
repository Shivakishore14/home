server:
  port: 8080
  db_path: "data/taskengine.db"
  heartbeat_timeout_seconds: 30
  stale_task_check_interval_seconds: 10

defaults:
  max_concurrent_tasks: 2
  path_mappings:
    "/Volumes/drive001/media": "/Volumes/drive001/media"
  plugin_configs:
    command-runner:
      shell: "/bin/zsh"
    video-transcoder:
      target_codec: "libx264"
      target_height: 1080
      crf: 21
      preset: "medium"
      audio_bitrate: "192k"
      ffmpeg_binary: "ffmpeg"
      ffprobe_binary: "ffprobe"

# Object storage (Cloudflare R2 bucket "taskengine"). Credentials come from the
# server's environment (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET); without them storage is disabled. Keys are namespaced per plugin:
#   <plugin>/in/<date>/<id>/<file>      client uploads
#   <plugin>/out/<task_id>/<id>-<file>  task outputs
# retention_days must mirror the bucket lifecycle rule for "<plugin>/".
storage:
  presign_put_ttl: "10m"
  presign_get_ttl: "1h"
  worker_get_ttl: "6h"
  namespaces:
    comfyui:
      retention_days: 10
      max_upload_mb: 25
      max_output_mb: 512
      allowed_mime: ["image/png", "image/jpeg", "image/webp"]

# Task callbacks: a task created with {"callback": {"url": "...", "ref": "..."}}
# gets a signed POST when it completes, fails for good, or is cancelled. URLs
# must be https and on this list. The signing secret is the server's
# TASKENGINE_CALLBACK_SECRET env var; without it callbacks are refused.
callbacks:
  allowed_hosts:
    - socialgrow.win
